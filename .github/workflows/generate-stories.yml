name: おはなしを つくる

# 子どもが注文した話を、数時間おきに作る。
# 判断の根拠は docs/story-authoring-design.md。
#
# アプリ側に生成の口を作らないので、Anthropic の API キーを置く場所はここだけ。
# Supabase は service_role ではなく anon キー + 合言葉で触る。
#
# 必要なシークレット（Settings > Secrets and variables > Actions）:
#   SUPABASE_URL, SUPABASE_ANON_KEY, FAMILY_CODE, ANTHROPIC_API_KEY

on:
  schedule:
    # 起きている時間だけ回す。UTC なので +9 時間が日本時間。
    # 7:00 / 10:00 / 13:00 / 16:00 / 19:00 JST
    - cron: '0 22,1,4,7,10 * * *'
  # 初回の確認と、待ちきれないときのために手でも回せるようにしておく
  workflow_dispatch:

# 前の回が長引いていても二重に走らせない
concurrency:
  group: generate-stories
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 注文された話を作る
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FAMILY_CODE: ${{ secrets.FAMILY_CODE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run stories
